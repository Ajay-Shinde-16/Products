spring:
  application:
    name: product-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/productdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# jwt settings
app:
  jwt:
    secret: ${JWT_SECRET:ThisIsASecretKeyForJwtPleaseChangeItInProduction123456}
    access-expiration-ms: 900000      # 15 minutes
    refresh-expiration-ms: 604800000  # 7 days
