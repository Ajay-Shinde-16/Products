spring:
  application:
    name: product-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/productdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# jwt settings
app:
  jwt:
    secret: ${JWT_SECRET:ThisIsASecretKeyForJwtPleaseChangeItInProduction123456}
    access-expiration-ms: 900000      # 15 minutes
    refresh-expiration-ms: 604800000  # 7 days